<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>income-form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylessheet" href="css/global.css">
</head>

<body>

    <div id="container">
        <div class="container container-costum d-flex justify-content-center align-items-center">
            <div class="form-card">
                <form id="formularios">
                    <h1 class="form-title text-center">Novo Ganho</h1>
                    
                    <div class="mb-5">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Digite o nome">

                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" class="form-control" rows="4" placeholder="Digite uma descrição"></textarea>
                        
                        <label for="categoria" class="form-label">Categoria</label>
                        <input type="text" id="categoria" class="form-control" placeholder="Ex: Salário">
                        
                        <label for="valor" class="form-label">Valor</label>
                        <input type="number" id="valor" class="form-control" placeholder="R$" step="0.01">

                    </div>

                    <div class="mb-4 checkbox-area">
                        <input type="checkbox" id="recorrente" class="form-check-input">
                        <label for="recorrente" class="form-label">recorrente</label>
                    </div> 

                    <div class="mb-3 d-none" id="dataContainer">
                        <label for="dataRecorrente" class="form-label">Data da recorrência</label>
                        <input type="date" id="dataRecorrente" class="form-control" >
                    </div>

                    <button type="submit" class="btn btn-success w-100">Salvar</button>
                </form>
            </div>
        </div>
    </div> 

    

</body>

<script src="/js/pages/income.js"></script>

</html>
