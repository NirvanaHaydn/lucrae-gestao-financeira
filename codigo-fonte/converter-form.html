<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Junge&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="css/global.css">
</head>
<body>
    <div id="navbar"></div>
    <main class="main-content d-flex justify-content-center align-items-center position-relative">
      <a href="dashboard.html" class="btn btn-success btn-lg top-left-btn">
    Voltar
</a>

  <div class="converter-card">

    <form id="currencyForm" class="p-3">

      <h1 class="text-center mb-4">Conversor de Moedas</h1>

      <div class="mb-3">
        <label>Valor</label>
        <input type="number" id="amount" class="form-control" placeholder="Digite o valor">
      </div>

      <div class="mb-3">
        <label>De</label>
        <select id="fromCurrency" class="form-control">
          <option value="BRL">Real (BRL)</option>
          <option value="USD">Dólar (USD)</option>
          <option value="EUR">Euro (EUR)</option>
        </select>
      </div>

      <div class="mb-3">
        <label>Para</label>
        <select id="toCurrency" class="form-control">
          <option value="USD">Dólar (USD)</option>
          <option value="BRL">Real (BRL)</option>
          <option value="EUR">Euro (EUR)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success w-100">
        Converter
      </button>

      <div class="result-box mt-4 text-center">
        <h3 id="result"></h3>
      </div>

    </form>

  </div>

</main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/pages/converter-form.js"></script>
    <script src="data/mock.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>

</body>

</html>
