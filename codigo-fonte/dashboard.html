<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Junge&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="css/global.css">
</head>
<body>
    <main class="main-content">

        <div class="container">
            <h1 class="display-4 fw-bold mb-5"
                id="welcome-user"></h1>
            <div class="row dashboard-layout g-4">
                <!--BOTÕES -->
                <div class="col-md-3">
                    <div class="btn-group-vertical dashboard-buttons">
                        <a href="income.html"
                           class="btn custom-dashboard-btn">
                            Recebimentos
                        </a>
                        <a href="expense.html"
                           class="btn custom-dashboard-btn">
                            Despesas
                        </a>
                        <a href="converter-form.html"
                           class="btn custom-dashboard-btn">
                            Conversor de Moedas
                        </a>
                    </div>
                </div>
                <!--DASHBOARD -->
                <div class="col-md-5">
                    <div class="dashboard-chart-card">
                        <h1 class="text-dark mb-4">
                            Resumo Financeiro
                        </h1>
                        <!-- GRÁFICO -->
                        <canvas id="myChart"></canvas>
                        <!-- DADOS -->
                        <div class="mt-4 text-dark">
                            <h5>
                                Receitas:
                                <span id="total-income">
                                    R$ 0
                                </span>
                            </h5>
                            <h5>
                                Despesas:
                                <span id="total-expense">
                                    R$ 0
                                </span>
                            </h5>
                            <h5>
                                Saldo:
                                <span id="balance">
                                    R$ 0
                                </span>
                            </h5>
                        </div>
                    </div>
                </div>
                <!--INFORMATIVO -->
                <div class="col-md-4">
                    <div class="card news-card">
                        <img src="assets/img/photos/acompanhe_seu_dinheiro.png"
                             class="card-img-top"
                             alt="Notícia">
                        <div class="card-body">
                            <h5 class="card-title">
                                Quero aprender a poupar e investir
                            </h5>
                            <p class="card-text">
                                Aprenda mais sobre investimentos,
                                controle financeiro e reservas
                                de emergência.
                            </p>
                            <a href="education.html"
                               class="btn custom-dashboard-btn">
                                Veja Mais
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="data/mock.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>

</body>

</html>
