<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Junge&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div id="container">
        <div id="navbar"></div>
        <main class="d-flex justify-content-center align-items-center">
            <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
                <h2 class="text-center mb-4">Cadastro</h2>
                <form>
                    <div class="mb-3">
                        <label for="nomeCompleto" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="nomeCompleto" required>
                    </div>
                    <div class="mb-3">
                        <label for="nomeUsuario" class="form-label">Nome de usuário</label>
                        <input type="text" class="form-control" id="nomeUsuario" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" required>
                    </div>
                    <div class="mb-3">
                        <label for="repetirSenha" class="form-label">Repetir senha</label>
                        <input type="password" class="form-control" id="repetirSenha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>

                    <div class="text-center mt-3">
                        <a href="login.html">Já possui conta? Entre</a>
                    </div>
                </form>
            </div>
        </main>

        <div id="footer" class="bg-light text-center p-3 mt-4">
            <p>&copy; 2026 Minha Aplicação - Todos os direitos reservados</p>
        </div>
    </div>
    <script src="/js/libs.js"></script>
    <script src="/js/pages/register.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>
</body>
</html>
