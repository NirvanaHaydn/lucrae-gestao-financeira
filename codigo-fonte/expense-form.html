<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulário</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/global.css">

    <link rel="stylesheet" href="css/forms.css">

</head>

<body>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">

        <a href="dashboard.html"
           class="btn btn-light back-button">

            Voltar

        </a>

        <div class="form-card">

            <form id="formularios">

                <h1 class="form-title text-center">

                    Registrar Despesa

                </h1>

                <div class="mb-4">

                    <label for="nome" class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Digite o nome"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label for="descricao" class="form-label">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        class="form-control"
                        rows="4"
                        placeholder="Digite uma descrição"
                        required
                    ></textarea>

                </div>


                <div class="mb-4">

                    <label for="categoria" class="form-label">
                        Categoria
                    </label>

                    <input
                        type="text"
                        id="categoria"
                        class="form-control"
                        placeholder="Ex: Salário"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label for="valor" class="form-label">
                        Valor
                    </label>

                    <input
                        type="number"
                        id="valor"
                        class="form-control"
                        placeholder="R$"
                        step="0.01"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label for="dataRecorrente" class="form-label">
                        Data
                    </label>

                    <input
                        type="date"
                        id="dataRecorrente"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-4 checkbox-area">

                    <input
                        type="checkbox"
                        id="recorrente"
                        class="form-check-input"
                    >

                    <label
                        for="recorrente"
                        class="form-label"
                    >

                        Recorrente

                    </label>

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100"
                >

                    Salvar

                </button>

            </form>

        </div>

    </main>

</body>

<script src="js/pages/expense.js"></script>

</html>
