<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recebimentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Junge&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/global.css">

    <link rel="stylesheet"
          href="css/income.css">

</head>

<body>

    <div id="navbar"></div>

    <main class="main-content">

        <div class="container">

            <h1 class="display-4 fw-bold mb-5"
                id="welcome-user">

                Recebimentos

            </h1>

            <div class="row g-4">

                <!-- Card lateral -->
                <div class="col-lg-3">

                    <div class="card income-card p-4">

                        <h3 class="mb-3">
                            Recebimentos
                        </h3>

                        <p>
                            Cadastre e acompanhe seus ganhos.
                        </p>

                        <a href="income-form.html"
                           class="btn custom-dashboard-btn mt-3">

                            Novo Recebimento

                        </a>

                    </div>

                </div>

                <!-- Tabela -->
                <div class="col-lg-6">

                    <div class="card income-card p-4">

                        <h3 class="mb-4">
                            Histórico de Recebimentos
                        </h3>

                        <div class="table-responsive">

                            <table
                                id="income-table"
                                class="table table-hover align-middle">

                                <thead>

                                    <tr>
                                        <th>Nome</th>
                                        <th>Categoria</th>
                                        <th>Valor</th>
                                        <th>Data</th>
                                        <th>Tipo</th>
                                    </tr>

                                </thead>

                                <tbody id="income-table-body"></tbody>

                            </table>

                        </div>

                    </div>

                </div>

                <!-- Ações -->
                <div class="col-lg-3">

                    <div class="card income-card p-4">

                        <h3 class="mb-4">
                            Ações
                        </h3>

                        <div class="d-grid gap-3">

                            <button
                                id="btn-pdf"
                                class="btn custom-dashboard-btn">

                                Gerar PDF

                            </button>

                            <button
                                class="btn custom-dashboard-btn"
                                data-bs-toggle="modal"
                                data-bs-target="#reservaModal">

                                Definir Reserva

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        
    </main>
    
    <!-- Modal Reserva -->
<div
    class="modal fade"
    id="reservaModal"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Definir Reserva
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <label
                    for="valorReserva"
                    class="form-label">

                    Valor da Reserva

                </label>

                <input
                    type="number"
                    class="form-control"
                    id="valorReserva"
                    min="0"
                    step="0.01">

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button
                    type="button"
                    class="btn btn-success"
                    id="salvarReserva">

                    Salvar

                </button>

            </div>

        </div>

    </div>

</div>
    <div
        id="mensagemReserva"
        class="mensagem-reserva d-none">

        Reserva salva com sucesso!

    </div>
    
    <div id="footer"></div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Componentes -->
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- Página -->
    <script src="js/pages/income-list.js"></script>

</body>

</html>
